  <text x="244" y="109" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#71717A">https://holaday.ai/app</text>

  <rect x="128" y="184" width="594" height="424" rx="22" fill="#FFFFFF" stroke="#E4E4E7"/>
  <text x="168" y="240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0A0A0A">Task workspace</text>
  <text x="168" y="274" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#71717A">HOLA DAY can use the browser pages you choose.</text>
  <rect x="168" y="324" width="486" height="64" rx="16" fill="#FDF2F8" stroke="#FBCFE8"/>
  <circle cx="202" cy="356" r="8" fill="#E50B6B"/>
  <text x="226" y="350" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Browser extension connected</text>
  <text x="226" y="373" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#71717A">Tasks can read context from the active tab when you ask.</text>
  <rect x="168" y="420" width="486" height="104" rx="16" fill="#FFFFFF" stroke="#E4E4E7"/>
  <text x="200" y="455" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#18181B">Privacy boundaries</text>
  <text x="200" y="486" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#71717A">Browsing history sync uses domain aggregates only.</text>
  <text x="200" y="512" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#71717A">Cookie sync is limited to supported task domains.</text>

  <rect x="804" y="170" width="348" height="474" rx="26" fill="#FFFFFF" stroke="#D4D4D8" filter="url(#shadow)"/>
  <rect x="840" y="208" width="72" height="72" rx="18" fill="#E50B6B"/>
  <rect x="862" y="230" width="13" height="13" rx="3" fill="white"/>
