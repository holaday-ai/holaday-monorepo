<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      D3 — defensive cache headers for the SPA shell. The hash-named
      JS/CSS bundles in /assets/ are content-addressed and safely
      cacheable forever, but THIS index.html must always re-fetch so
      a new bundle hash takes effect on next reload (otherwise users
      stay on the previous SPA build until they hard-refresh).
      `add_header` in nginx is the primary control — these meta tags
      are belt-and-suspenders for any cached HTML still in browser
      memory from before the nginx fix landed.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea1f59" />
    <meta
      name="description"
      content="HOLA DAY — 你的 AI 助手，帮你操作任何网站。"
    />
    <meta property="og:title" content="HOLA DAY" />
    <meta
      property="og:description"
      content="HOLA DAY — 你的 AI 助手，帮你操作任何网站。"
    />
    <meta property="og:type" content="website" />
    <title>HOLA DAY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
