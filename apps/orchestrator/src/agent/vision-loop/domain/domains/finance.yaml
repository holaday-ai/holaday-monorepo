domain: finance
keywords:
  - 股票
  - 基金
  - 财报
  - K线
  - 涨跌
  - 市盈率
  - ROE
  - 净利润
  - ETF
  - 茅台
  - 东方财富
  - 雪球
analysis_framework: |
  分析时关注：营收增长率、净利润、毛利率、ROE、ROIC、FCF、PE、PB、股息率。
  对比同行业均值和历史趋势。区分一次性收益和经常性经营利润。查看财报附注里的或有负债、
  关联交易和会计政策变更。
recommended_sources:
  - name: 东方财富
    url: eastmoney.com
    use_for: 财报数据、实时行情、板块资金流
  - name: 雪球
    url: xueqiu.com
    use_for: 机构观点、个股讨论、公告聚合
  - name: 同花顺
    url: 10jqka.com.cn
    use_for: 技术指标、选股器、行业对比
  - name: Yahoo Finance
    url: finance.yahoo.com
    use_for: 美股数据、全球市场、ETF 持仓
output_format: |
  用表格对比关键财务指标，标注同比 / 环比增速。
  投资建议必须附带风险提示，明确区分事实和观点。
  引用数据时标注来源和时间点（例：2024 Q3 营收 ¥ X 亿，来源东方财富）。
disclaimer: 以上分析仅供参考，不构成投资建议。投资有风险，决策需谨慎。
