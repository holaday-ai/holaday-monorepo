# Phase 11 — cn-payment gateway (WeChat + Alipay)

# HTTP -> HTTPS redirect (also serves ACME challenge)
server {
    listen 80;
    server_name hd-pay.orangebench.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://hd-pay.orangebench.tech$request_uri;
    }
}

# Reverse proxy to the cn-payment service on :4010.
# WeChat / Alipay sign over the LITERAL request body bytes; we must
# not have any middleware (gzip, body-rewriting modules) between
# nginx and the upstream that would alter bytes.
server {
    listen 443 ssl http2;
    server_name hd-pay.orangebench.tech;

    ssl_certificate     /etc/letsencrypt/live/hd-pay.orangebench.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hd-pay.orangebench.tech/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 1m;
    }
}
