# /etc/nginx/sites-available/hd-app.orangebench.tech
#
# China-accessible edge for HOLA DAY. Aliyun (47.99.169.186) terminates
# TLS for hd-app.orangebench.tech, serves the SPA static bundle from
# /opt/holaday-spa/dist/, and reverse-proxies /api + /ws to Vultr
# Singapore (207.148.70.106). Users in China can reach this domain
# without a VPN; Aliyun→Vultr egress is open.
#
# Coexists with /etc/nginx/sites-available/hd-pay.orangebench.tech
# (Phase 11 cn-payment) — different server_name, no overlap.
#
# Path conventions match the existing Vultr nginx:
#   - "/api/*"  →  proxy_pass strips "/api/" (trailing slash) so the
#                  orchestrator sees /trpc/..., /healthz, /auth/google,
#                  /files/upload etc. The orchestrator's internal routes
#                  are mounted WITHOUT the /api prefix (a76d0b2 fix).
#   - "/ws"    →  proxy_pass to ws://207.148.70.106:4002/ ; subprotocol
#                  header preserved for jwt.<token> auth.
#   - "/"      →  static SPA from /opt/holaday-spa/dist with HTML5
#                  history fallback (try_files → index.html).

# Connection upgrade map (re-declared per-vhost is wasteful; if /etc/nginx/
# nginx.conf doesn't already declare a global one, add this map block in
# /etc/nginx/conf.d/00-upgrade.conf instead).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect (also serves the certbot HTTP-01 challenge).
server {
    listen 80;
    listen [::]:80;
    server_name hd-app.orangebench.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hd-app.orangebench.tech;

    # certbot manages these. After running:
    #   certbot --nginx -d hd-app.orangebench.tech
    # the include path will be set automatically. Until then nginx
    # would refuse to start, so DEPLOY ORDER is:
    #   1. install this file with the listen 443 block COMMENTED
    #   2. nginx -t && nginx -s reload
    #   3. certbot --nginx -d hd-app.orangebench.tech
    #   4. uncomment the listen 443 block (certbot may have already
    #      patched it) and reload.
    ssl_certificate     /etc/letsencrypt/live/hd-app.orangebench.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hd-app.orangebench.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Hardening — adjust to match the hd-pay vhost defaults.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Generous body cap so file uploads (multer, 10MB pro plan) clear.
    client_max_body_size 16m;

    # ---- 1. tRPC + REST API → Vultr orchestrator HTTP (4001) ----
    # Trailing slash on proxy_pass strips the leading "/api/" — the
    # backend mounts everything at root (/trpc, /healthz, /auth/*,
    # /files/*, /internal/*). MUST stay this way per the a76d0b2
    # nginx-strip postmortem.
    location /api/ {
        proxy_pass http://207.148.70.106:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;            # so OAuth redirect_uri
                                                # uses hd-app.orangebench.tech
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 15s;
    }

    # ---- 2. WebSocket → Vultr orchestrator WS (4002) ----
    # No trailing slash on proxy_pass: orchestrator's WS server expects
    # the connection at the root path. Hopefully also keep `/ws` (no
    # subpath) to match the SPA's buildWsUrl().
    location = /ws {
        proxy_pass http://207.148.70.106:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running WS — disable read timeout (orchestrator sends
        # heartbeats every 30s; default 60s read timeout would kill
        # idle sockets).
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ---- 3. SPA static bundle ----
    # Hashed asset URLs get long-cache (Vite emits content-hashed
    # filenames). The HTML entry must NOT cache so a redeploy is
    # picked up immediately.
    root /opt/holaday-spa/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed assets — safe to cache aggressively.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry HTML and manifest must always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
