# /etc/nginx/sites-available/hd-app.orangebench.tech
#
# China-accessible edge for HOLA DAY. Aliyun (47.99.169.186) terminates
# TLS for hd-app.orangebench.tech, serves versioned local web assets,
# and reverse-proxies /api + /ws to the Vultr
# orchestrator's PUBLIC TLS endpoint (https://holaday.ai). The
# orchestrator's bare ports 4001/4002 are firewalled at the IP — only
# Vultr's nginx on 80/443 is exposed externally — so going through
# Vultr's nginx (which is a default_server that accepts any Host) is
# the only path that works.
#
# Phase 28 CF migration (2026-05-19): holaday.ai NS moved to
# Cloudflare. Cloudflare rejects a Host header that differs from the
# TLS authority, while OAuth must retain hd-app.orangebench.tech as
# the browser-facing host. All API and WebSocket routes therefore use
# the Vultr IP directly, verify its holaday.ai certificate via SNI,
# and preserve the original Host header for the orchestrator.
#
# Coexists with /etc/nginx/sites-available/hd-pay.orangebench.tech
# (Phase 11 cn-payment) — distinct server_name.
#
# Companion: /etc/nginx/conf.d/00-holaday-upgrade.conf declares the
# `connection_upgrade` map (a single global declaration shared across
# vhosts; the deploy.sh installs it idempotently).

server {
    listen 80;
    listen [::]:80;
    server_name hd-app.orangebench.tech;

    # ACME HTTP-01 webroot (kept post-bootstrap so certbot can renew).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hd-app.orangebench.tech;

    # certbot --nginx writes these paths; deploy script uses
    # `certbot certonly --webroot` then this vhost is dropped in.
    ssl_certificate     /etc/letsencrypt/live/hd-app.orangebench.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hd-app.orangebench.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;

    # ===== Phase 20: landing page (exact-match wins over SPA catch-all) =====
    location = / {
        root /opt/holaday-edge/current/apps/holaday-landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /terms {
        root /opt/holaday-edge/current/apps/holaday-landing;
        try_files /terms.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /privacy {
        root /opt/holaday-edge/current/apps/holaday-landing;
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /robots.txt {
        root /opt/holaday-edge/current/apps/holaday-landing;
        try_files /robots.txt =404;
        access_log off;
    }
    location = /sitemap.xml {
        root /opt/holaday-edge/current/apps/holaday-landing;
        try_files /sitemap.xml =404;
    }
    location = /og-image.png {
        root /opt/holaday-edge/current/apps/holaday-landing;
        expires 7d;
    }
    location = /favicon.svg {
        root /opt/holaday-edge/current/apps/holaday-landing;
        expires 7d;
    }
    location /landing-assets/ {
        root /opt/holaday-edge/current/apps/holaday-landing;
        expires 7d;
        try_files $uri =404;
    }
    # ===== end landing =====

    # ---- 1. tRPC + REST API → Vultr TLS origin ----
    # proxy_pass form WITHOUT URI: nginx appends $request_uri verbatim,
    # so /api/healthz lands at holaday.ai/api/healthz. Vultr nginx then
    # strips its own /api/ via trailing slash → orchestrator sees /healthz.
    # proxy_ssl_name + server_name on lets the upstream TLS handshake
    # use SNI=holaday.ai so Vultr nginx serves the right vhost cert.
    # Preserve the browser-facing Host so Google OAuth creates its
    # callback URL and state cookie on the same domain.
    location /api/ {
        proxy_pass https://207.148.70.106;
        proxy_ssl_server_name on;
        proxy_ssl_name holaday.ai;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 15s;
    }

    # ---- 2a. Per-user screencast WebSocket (Phase 19 CDP path) ----
    # Cloudflare geo-redirect rules have historically lagged new WS paths.
    # Send this interaction-critical channel straight to the Vultr TLS origin
    # while retaining the certificate SNI and virtual-host name.
    location ^~ /screencast-ws/ {
        proxy_pass https://207.148.70.106;
        proxy_ssl_server_name on;
        proxy_ssl_name holaday.ai;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host holaday.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ---- 2a-legacy. Per-user VNC WebSocket → wss://holaday.ai/vnc-ws/<userId>?token=... ----
    # The browser panel's noVNC RFB client opens this path. Without it
    # the panel falls through to JPEG screencast mode, and JPEG-mode
    # input events route to the SHARED PlaywrightExecutor (not the
    # caller's per-user pool Brave) — clicks effectively land on the
    # wrong browser. Proxy it through so VNC takes over input handling
    # natively (mouse / keyboard / scroll all flow direct to x11vnc).
    location ^~ /vnc-ws/ {
        proxy_pass https://207.148.70.106;
        proxy_ssl_server_name on;
        proxy_ssl_name holaday.ai;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # VNC frames stream indefinitely; default 60s read timeout
        # would tear down healthy idle sessions.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ---- 2b. Workbench WebSocket → wss://holaday.ai/ws ----
    # Browsers use HTTP/1.1 for WebSocket upgrades automatically (RFC
    # 8441 over HTTP/2 isn't widely supported); curl users testing this
    # need `--http1.1` or they'll see a 426 from the http2 listener.
    # Subprotocol header preserved for the orchestrator's `jwt.<token>`
    # auth path. Long read timeout because the orchestrator's heartbeat
    # is 30s — anything shorter would hang up healthy idle sockets.
    location = /ws {
        proxy_pass https://207.148.70.106;
        proxy_ssl_server_name on;
        proxy_ssl_name holaday.ai;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ---- 3. SPA static bundle ----
    root /opt/holaday-edge/current/apps/web-workbench/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Vite emits content-hashed filenames under /assets/ — safe to
    # immutable-cache for a year.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry HTML must always revalidate so a redeploy is picked up
    # immediately by returning visitors.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
