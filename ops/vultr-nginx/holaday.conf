# HOLA DAY — holaday.ai
# HTTP: orchestrator 4001 (tRPC + REST + /healthz)
# WS:   orchestrator 4002

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Phase 20 — www.holaday.ai → 301 → https://holaday.ai (apex canonical)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.holaday.ai;

    ssl_certificate /etc/letsencrypt/live/holaday.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holaday.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://holaday.ai$request_uri;
}

server {
    server_name holaday.ai;

    # Let's Encrypt ACME
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ===== Phase 20: landing page (exact-match wins over SPA catch-all) =====
    location = / {
        root /opt/holaday-landing;
        try_files /index.html =404;
    }
    location = /terms {
        root /opt/holaday-landing;
        try_files /terms.html =404;
    }
    location = /privacy {
        root /opt/holaday-landing;
        try_files /privacy.html =404;
    }
    location = /robots.txt {
        root /opt/holaday-landing;
        try_files /robots.txt =404;
        access_log off;
    }
    location = /sitemap.xml {
        root /opt/holaday-landing;
        try_files /sitemap.xml =404;
    }
    location = /og-image.png {
        root /opt/holaday-landing;
        expires 7d;
    }
    location = /favicon.svg {
        root /opt/holaday-landing;
        expires 7d;
    }
    location /landing-assets/ {
        root /opt/holaday-landing;
        expires 7d;
        try_files $uri =404;
    }
    # ===== end landing =====

    # Static SPA (root applies to anything not matched above)
    root /opt/holaday-monorepo/apps/web-workbench/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25m;

    # Hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache. Hashed assets above are immutable
    # (filename changes per build), so the only piece that needs
    # busting on every deploy is index.html itself. Without this,
    # a browser holding the old index.html will request the old
    # bundle hashes and 404 (or worse, render stale code after a
    # deploy that purged the old assets).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Frontend uses `/api/*` (vite rewrite in dev). Strip `/api/` and forward.
    location /api/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /trpc/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:4002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /screencast-ws/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /vnc-ws/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback — MUST be last location.
    # Routes like /settings or /admin/finance fall through to
    # index.html via try_files; their response inherits headers
    # from THIS block (not from `location = /index.html`). So the
    # no-cache headers live here too — otherwise a browser that
    # cached /settings would never see a new index.html with
    # updated bundle hashes after a deploy.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # default_server makes this block the catch-all for any Host that
    # doesn't match a server_name. This matters because the Aliyun edge
    # (hd-app.orangebench.tech) proxies /api, /ws, /vnc-ws, etc. to
    # https://holaday.ai but preserves the original Host header — those
    # requests have Host: hd-app.orangebench.tech and would otherwise
    # land in whichever 443 server block nginx loaded first (the www→
    # apex redirect block, which 301s everything). Marking apex as
    # default_server routes unknown-Host traffic here, where the
    # location rules handle /api/ etc. correctly.
    listen [::]:443 ssl ipv6only=on default_server;
    listen 443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/holaday.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holaday.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS apex (force apex on both names)
server {
    listen 80;
    listen [::]:80;
    server_name holaday.ai www.holaday.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://holaday.ai$request_uri;
    }
}
